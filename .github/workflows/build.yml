# Compila el APK en GitHub: pestaña Actions › "Compilar APK" › Run workflow.
# El APK queda en "Artifacts" (CarLauncher4-apk) y también en la rama "apk".
name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.27.4'
          cache: true

      # Completa la carpeta android/ (gradle, recursos, íconos) sin tocar los archivos propios
      - name: Generar archivos de plataforma
        run: |
          flutter create --platforms=android --org com.rgservice --project-name carlauncher4 .
          # la radio es Android 10: mínimo Android 8 (API 26)
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 26/' android/app/build.gradle* || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 26/' android/app/build.gradle* || true
          grep -n "minSdk" android/app/build.gradle* || true

      - name: Dependencias
        run: flutter pub get

      - name: Revisar código
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Compilar release
        run: flutter build apk --release

      - name: Preparar salida
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk out/CarLauncher4.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: CarLauncher4-apk
          path: out/CarLauncher4.apk

      - name: Guardar en la rama "apk"
        run: |
          cd out
          git init -q
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -q -b apk
          git add -A
          git commit -q -m "APK ${GITHUB_SHA::7} (run ${GITHUB_RUN_ID})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk
