# Compila el APK en GitHub (pestaña Actions). Solo a mano: Actions › Compilar APK › "Run workflow".
# Además lo prueba en un emulador Android 10 (como la radio) y guarda APK, capturas y registro
# en la rama "apk" del repositorio.
name: Compilar APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # El proyecto no trae gradlew: se usa Gradle 8.2 (la versión que espera AGP 8.1.4)
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Compilar release
        run: gradle --no-daemon assembleRelease

      - name: Verificar firma y contenido
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/CarLauncher3.apk
          $BT/apksigner verify --print-certs out/CarLauncher3.apk | tee out/firma.txt
          $BT/aapt dump badging out/CarLauncher3.apk | tee out/badging.txt
          ls -la out

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Probar en emulador Android 10 (1024x600)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/test-emulador.sh

      - name: Guardar en la rama "apk"
        if: always()
        run: |
          cd out
          git init -q
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -q -b apk
          git add -A
          git commit -q -m "APK ${GITHUB_SHA::7} (run ${GITHUB_RUN_ID})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk
